# unreal_nx - gyro aiming and movement tuning
#
# Put this file in /switch/unreal/gyro.cfg, next to unreal.nro
# (NOT inside SystemARM).
#
# It is read every time the game starts: change a number, relaunch, try it.
# No rebuild needed. If the file is missing, the values below are used anyway.
#
# The gyro is injected as mouse movement, so it ends up on aMouseX / aMouseY:
# pure relative movement, without the response curve and acceleration the
# engine applies to the analog stick (aTurn, SpeedBase). That is what makes it
# 1:1. The sensor is read at full rate - every sample in the buffer, averaging
# only the ones that are new since the last frame - instead of one sample per
# frame, which is what otherwise makes aiming feel late.
#
# In game: hold L3 + R3 together to switch the gyro on and off.

# 1 = gyro on at startup, 0 = off at startup (L3+R3 toggles it either way).
enabled = 1

# --- gyro axes ---------------------------------------------------------------
# All three are SIGNED: if an axis turns the wrong way, flip its sign.
# They are independent, so tune them one at a time. Larger magnitude = faster.

# Horizontal: tilt the console sideways while keeping the screen in front of
# your eyes, one wrist coming in and the other going out. Sensor Y axis.
yaw = -6.7

# Vertical: tilt forward and backward. Sensor X axis.
pitch = 4.0

# Third axis, the "steering wheel" gesture. It is added to the horizontal
# movement rather than replacing it. The two gestures live on different sensor
# axes: holding the console you tilt it, holding a Pro Controller you sweep the
# whole pad. With both active it works whichever way you hold it, with no
# guessing about the grip. 0 turns it off.
roll = -6.7

# --- left stick (movement) ---------------------------------------------------
# 1 = linear. Higher keeps small pushes slow and moves full speed towards the
# end of the stick travel, which makes the middle of the range controllable.
# At 3.5, half stick travel gives roughly 9% of full speed.
movecurve = 3.5

# Dead zone, rescaled: movement starts from zero at its edge instead of
# jumping straight to the threshold value.
deadzone = 0.10

# Dynamic lights: a texture that was just updated is not updated again for this
# many frames (the newest update is kept and sent in time). 1 = off, 5 = default.
# Higher is faster in lit scenes, at the cost of lights reacting a little later.
# uploadinterval = 5

# --- advanced ----------------------------------------------------------------
# Texture uploads through a pixel buffer object. 1 = on (default), 0 = plain
# direct uploads. Measured on hardware to make no real difference to speed; it
# is here so it can be switched off if it ever misbehaves on a given setup.
# pbo = 1

# Gyro zero-drift mode: 0 = loose (default), 1 = standard (the system default),
# 2 = tight.
# driftmode = 0

# 1 = log the raw gyro axes over nxlink, for working out which physical motion
# drives which axis.
# debug = 0
